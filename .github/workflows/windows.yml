name: Windows validation and packages
on:
  push:
    branches: [windows-support]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      AI_AUDIO_NO_PAUSE: '1'
      AI_AUDIO_NO_OPEN: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.11.1
          cache: npm
      - name: Build and unit tests
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run test:installer
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run bundle:server
          exit $LASTEXITCODE
      - name: Verify Python path reuse on Windows
        shell: pwsh
        run: |
          $python=py -3.11 -c 'import sys;print(sys.executable)'
          node scripts/python-path-smoke.mjs $python
          exit $LASTEXITCODE
      - name: Build lite with app-local Microsoft runtime
        shell: pwsh
        run: |
          $crt=Get-ChildItem 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Redist\MSVC\*\x64\Microsoft.VC143.CRT' -Directory | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $crt) { throw 'Official Visual Studio x64 CRT directory missing' }
          $env:VC_REDIST_DIR=$crt.FullName
          $work=Join-Path $env:RUNNER_TEMP '音频 Windows test'
          "WIN_TEST_ROOT=$work" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          node scripts/build-windows.mjs lite $work
          exit $LASTEXITCODE
      - name: Cold lite installation through double-click launcher
        shell: pwsh
        run: |
          $env:AI_AUDIO_ISOLATED_PYTHON='1'
          $env:AI_AUDIO_CACHE_DIR=Join-Path $env:WIN_TEST_ROOT 'cold-cache'
          $env:AI_AUDIO_DATA_ROOT=Join-Path $env:WIN_TEST_ROOT 'cold-data'
          $env:PATH="$env:SystemRoot;$env:SystemRoot\System32"
          Remove-Item Env:CONDA_PREFIX,Env:VIRTUAL_ENV,Env:SPEAKER_PYTHON,Env:PYTHONPATH -ErrorAction SilentlyContinue
          & (Join-Path $env:WIN_TEST_ROOT 'AI-Audio-Notes-Lite\Prepare.cmd')
          exit $LASTEXITCODE
      - name: Verify lite reuse, transcription, diarization and exports
        shell: pwsh
        run: |
          node scripts/windows-validation.mjs $env:WIN_TEST_ROOT (Join-Path $env:WIN_TEST_ROOT 'AI-Audio-Notes-Lite')
          exit $LASTEXITCODE
      - name: Build full only after lite passes
        shell: pwsh
        run: |
          node scripts/build-windows.mjs full $env:WIN_TEST_ROOT (Join-Path $env:WIN_TEST_ROOT 'cold-cache')
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $moved=Join-Path $env:WIN_TEST_ROOT '搬家 Full package'
          Move-Item -LiteralPath (Join-Path $env:WIN_TEST_ROOT 'AI-Audio-Notes') -Destination $moved
          node scripts/windows-acceptance.mjs $env:WIN_TEST_ROOT full $moved
          exit $LASTEXITCODE
      - name: Package validated distributions
        shell: pwsh
        run: |
          $out=Join-Path $env:WIN_TEST_ROOT 'release'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          # Native tar ZIP preserves files without PowerShell's 2 GB limitation.
          Move-Item -LiteralPath (Join-Path $env:WIN_TEST_ROOT '搬家 Full package') -Destination (Join-Path $env:WIN_TEST_ROOT 'AI-Audio-Notes')
          # Lite's installed junction must never include downloaded dependencies.
          Remove-Item -LiteralPath (Join-Path $env:WIN_TEST_ROOT 'AI-Audio-Notes-Lite\node_modules\sherpa-onnx-win-x64') -Force
          foreach($tool in @('ffmpeg','ffprobe')) { Remove-Item -LiteralPath (Join-Path $env:WIN_TEST_ROOT "AI-Audio-Notes\node_modules\@$tool-installer\win32-x64") -Recurse -Force -ErrorAction SilentlyContinue }
          Set-Location -LiteralPath $env:WIN_TEST_ROOT
          foreach($variant in @('lite','full')) {
            $folder=if($variant -eq 'lite'){'AI-Audio-Notes-Lite'}else{'AI-Audio-Notes'}
            tar.exe -a -cf "release/AI-Audio-Notes-v0.4.0-$variant-windows-x64.zip" $folder
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          Get-ChildItem $out -Filter '*.zip' | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content (Join-Path $out 'SHA256SUMS.txt') -Encoding utf8NoBOM
      - name: Validate extracted full ZIP with original runtimes unavailable
        shell: pwsh
        run: |
          Set-Location -LiteralPath $env:WIN_TEST_ROOT
          Move-Item -LiteralPath 'cold-cache' -Destination 'cold-cache-hidden'
          Move-Item -LiteralPath 'AI-Audio-Notes-Lite' -Destination 'lite-hidden'
          Move-Item -LiteralPath 'AI-Audio-Notes' -Destination 'original-full-hidden'
          New-Item -ItemType Directory -Path 'fresh-extraction' | Out-Null
          tar.exe -xf 'release/AI-Audio-Notes-v0.4.0-full-windows-x64.zip' -C 'fresh-extraction'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $full=Join-Path $env:WIN_TEST_ROOT 'fresh-extraction\AI-Audio-Notes'
          $links=Get-ChildItem -LiteralPath $full -Recurse -Attributes ReparsePoint
          if ($links) { throw 'Full ZIP contains external links' }
          Set-Location -LiteralPath $env:GITHUB_WORKSPACE
          node scripts/windows-acceptance.mjs $env:WIN_TEST_ROOT full-zip $full
          exit $LASTEXITCODE
      - name: Validate extracted lite ZIP reuses the sibling full package
        shell: pwsh
        run: |
          $node=(Get-Command node.exe).Source
          Set-Location -LiteralPath $env:WIN_TEST_ROOT
          tar.exe -xf 'release/AI-Audio-Notes-v0.4.0-lite-windows-x64.zip' -C 'fresh-extraction'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:AI_AUDIO_DATA_ROOT=Join-Path $env:WIN_TEST_ROOT 'lite-zip-data'
          $env:PATH="$env:SystemRoot;$env:SystemRoot\System32"
          Remove-Item Env:AI_AUDIO_NODE,Env:AI_AUDIO_CACHE_DIR,Env:SPEAKER_PYTHON,Env:SPEAKER_MODEL_ROOT,Env:PARAFORMER_MODEL_DIR,Env:AI_AUDIO_ISOLATED_PYTHON -ErrorAction SilentlyContinue
          & (Join-Path $env:WIN_TEST_ROOT 'fresh-extraction\AI-Audio-Notes-Lite\Prepare.cmd')
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $report=Get-Content -LiteralPath (Join-Path $env:AI_AUDIO_DATA_ROOT 'runtime-cache\environment.json') -Raw | ConvertFrom-Json
          if ($report.report.downloaded.Count -ne 0) { throw 'Extracted lite must reuse the sibling full package without downloading dependencies' }
          if (Test-Path -LiteralPath (Join-Path $env:AI_AUDIO_DATA_ROOT 'runtime-cache\node-v26.11.1-win-x64.zip')) { throw 'Lite downloaded Node instead of reusing the sibling full runtime' }
          $report.report | ConvertTo-Json -Depth 10 | Set-Content (Join-Path $env:WIN_TEST_ROOT 'lite-zip-reuse.json') -Encoding utf8NoBOM
          Set-Location -LiteralPath $env:GITHUB_WORKSPACE
      - name: Upload tested packages to an unpublished draft release
        if: success() && github.ref == 'refs/heads/windows-support' && github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $out=Join-Path $env:WIN_TEST_ROOT 'release'
          $validation=@{
            commit=$env:GITHUB_SHA
            run="https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            os=[Environment]::OSVersion.VersionString
            image=$env:ImageVersion
            results=@{}
          }
          Get-ChildItem -LiteralPath $env:WIN_TEST_ROOT -Filter '*-acceptance.json' | ForEach-Object { $validation.results[$_.Name]=Get-Content $_.FullName -Raw | ConvertFrom-Json }
          Get-ChildItem -LiteralPath $env:WIN_TEST_ROOT -Filter '*-reuse.json' | ForEach-Object { $validation.results[$_.Name]=Get-Content $_.FullName -Raw | ConvertFrom-Json }
          $validation | ConvertTo-Json -Depth 20 | Set-Content (Join-Path $out 'VALIDATION.json') -Encoding utf8NoBOM
          $existing=gh release view v0.4.0 --repo $env:GITHUB_REPOSITORY --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (-not ($existing | ConvertFrom-Json).isDraft) { throw 'Refusing to replace an already published release' }
            gh release edit v0.4.0 --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --notes-file RELEASE_NOTES_v0.4.0.md
          } else {
            gh release create v0.4.0 --repo $env:GITHUB_REPOSITORY --draft --target $env:GITHUB_SHA --title 'v0.4.0 — Windows x64 轻量版与完整版' --notes-file RELEASE_NOTES_v0.4.0.md
          }
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $assets=@((Join-Path $out 'AI-Audio-Notes-v0.4.0-lite-windows-x64.zip'),(Join-Path $out 'AI-Audio-Notes-v0.4.0-full-windows-x64.zip'),(Join-Path $out 'SHA256SUMS.txt'),(Join-Path $out 'VALIDATION.json'))
          gh release upload v0.4.0 --repo $env:GITHUB_REPOSITORY --clobber @assets
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: windows-release
          path: ${{ env.WIN_TEST_ROOT }}/release/*
          compression-level: 0
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-validation-evidence
          path: |
            ${{ env.WIN_TEST_ROOT }}/*-acceptance.json
            ${{ env.WIN_TEST_ROOT }}/*-reuse.json
            ${{ env.WIN_TEST_ROOT }}/*-launch.log
            ${{ env.WIN_TEST_ROOT }}/accept-*-data/run/backend.log
            ${{ env.WIN_TEST_ROOT }}/cold-cache/environment.json
          retention-days: 14
